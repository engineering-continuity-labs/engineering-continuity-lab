name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and browser report explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the package and type checker
        run: python -m pip install --upgrade pip setuptools && python -m pip install -e . mypy
      - name: Run Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run strict type checks
        run: python -m mypy --strict src
      - name: Run JavaScript model tests
        run: node --test ui/tests/model.test.js
      - name: Validate static browser UI
        run: |
          node --check ui/dist/app.js
          node --check ui/dist/model.js
          test -f ui/dist/index.html
          test -f ui/dist/styles.css
