[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-continuity-lab"
version = "0.1.0"
description = "Experimental, explainable engineering continuity analysis from Git history"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
continuity = "continuity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
